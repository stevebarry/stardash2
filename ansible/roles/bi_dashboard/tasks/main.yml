# Deploy the BI Dashboard application: code, virtualenv, config.py, gunicorn (systemd) and NGINX.

# A failed assert reports the condition and message, never the variable values.
- name: Check database password
  ansible.builtin.assert:
    that:
      - bi_db_password | default('') | length > 0
      - bi_db_password | default('') != 'change_me'
    fail_msg: >-
      bi_db_password is empty or still 'change_me'. Set vault_bi_db_password in
      group_vars/all/vault.yml (ansible-vault edit group_vars/all/vault.yml).
    quiet: true

- name: Check Flask secret key
  ansible.builtin.assert:
    that:
      - bi_secret_key | default('') != 'change_me'
      - bi_secret_key | default('') | length >= 32
    fail_msg: >-
      bi_secret_key is missing, still 'change_me', or shorter than 32 characters.
      Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      and set it as vault_bi_secret_key in group_vars/all/vault.yml
      (ansible-vault edit group_vars/all/vault.yml).
    quiet: true

- name: Install system packages
  ansible.builtin.apt:
    # libpango*, libharfbuzz-subset0 and fonts-dejavu-core are needed by WeasyPrint (PDF export)
    name: [python3, python3-venv, python3-pip, nginx, rsync, postgresql-client, acl,
           libpango-1.0-0, libpangoft2-1.0-0, libharfbuzz-subset0, fonts-dejavu-core]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application directory
  ansible.builtin.file:
    path: "{{ bi_app_dir }}"
    state: directory
    owner: root
    group: "{{ bi_app_group }}"
    mode: "0755"

- name: Copy application code
  ansible.posix.synchronize:
    src: "{{ bi_source_dir }}/"
    dest: "{{ bi_app_dir }}/"
    delete: true
    recursive: true
    rsync_opts:
      # files managed on the server are excluded (and therefore never deleted)
      - "--exclude=.git"
      - "--exclude=venv"
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
      - "--exclude=ansible"
      - "--exclude=tests"
      - "--exclude=/config.py"
      - "--exclude=/gunicorn.conf.py"
      - "--chmod=D755,F644"
      - "--chown=root:{{ bi_app_group }}"
  notify: Restart bi-dashboard

- name: Write config.py
  ansible.builtin.template:
    src: config.py.j2
    dest: "{{ bi_app_dir }}/config.py"
    owner: root
    group: "{{ bi_app_group }}"
    mode: "0640"
  notify: Restart bi-dashboard

- name: Write gunicorn.conf.py
  ansible.builtin.template:
    src: gunicorn.conf.py.j2
    dest: "{{ bi_app_dir }}/gunicorn.conf.py"
    owner: root
    group: "{{ bi_app_group }}"
    mode: "0644"
  notify: Restart bi-dashboard

- name: Install Python dependencies into the virtualenv
  ansible.builtin.pip:
    requirements: "{{ bi_app_dir }}/requirements.txt"
    virtualenv: "{{ bi_app_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart bi-dashboard

- name: Create or upgrade configuration tables
  ansible.builtin.command:
    cmd: "{{ bi_app_dir }}/venv/bin/python scripts/init_db.py"
    chdir: "{{ bi_app_dir }}"
  register: bi_init_db
  changed_when: false
  when: bi_run_init_db | bool
  tags: [init_db]

- name: Install systemd unit
  ansible.builtin.template:
    src: bi-dashboard.service.j2
    dest: "/etc/systemd/system/{{ bi_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart bi-dashboard

- name: Configure service state
  ansible.builtin.systemd:
    name: "{{ bi_service_name }}"
    daemon_reload: true
    enabled: "{{ bi_start_service | bool }}"
    state: "{{ 'started' if bi_start_service | bool else 'stopped' }}"

- name: Install NGINX site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ bi_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable NGINX site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ bi_service_name }}"
    dest: "/etc/nginx/sites-enabled/{{ bi_service_name }}"
    state: link
  notify: Reload nginx

- name: Remove NGINX default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: bi_nginx_remove_default_site | bool
  notify: Reload nginx

- name: Ensure NGINX is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Configure firewall
  when: bi_configure_ufw | bool
  block:
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH
    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "{{ bi_http_port | string }}"
        proto: tcp
    - name: Enable ufw
      community.general.ufw:
        state: enabled

- name: Apply pending restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Check the login page responds through NGINX
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ bi_http_port }}/login"
    status_code: 200
  register: bi_health
  retries: 5
  delay: 3
  until: bi_health.status == 200
  when: bi_start_service | bool
