# Deploy the BI Dashboard.
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml --ask-vault-pass
- name: Deploy BI Dashboard
  hosts: bi_dashboard
  become: true
  roles:
    - role: bi_database
      when: bi_manage_database | bool
      tags: [database]
    - role: bi_dashboard
      tags: [app]
