# Locations for the BI Dashboard, served at http://<server>/stardash/
# Install to /etc/nginx/app-locations/stardash.conf (included by apps.conf).
# The prefix must match URL_PREFIX in config.py.

location = /stardash {
    return 301 /stardash/;
}

location /stardash/static/ {
    alias /opt/stardash/app/static/;
    expires 1h;
}

location /stardash/ {
    client_max_body_size 50m;   # export requests carry chart images

    # No URI after the address: the full path, including /stardash, is passed on.
    # The app strips the prefix itself (URL_PREFIX in config.py).
    proxy_pass http://unix:/run/stardash/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
