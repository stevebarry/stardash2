# Shared server block for all applications on this NGINX instance.
# Install once per server (skip if another application already installed it):
#   sudo cp deploy/nginx/apps.conf /etc/nginx/sites-available/apps
#   sudo ln -s /etc/nginx/sites-available/apps /etc/nginx/sites-enabled/
# Each application adds its own locations in /etc/nginx/app-locations/<app>.conf.
server {
    listen 80;
    server_name _;

    include /etc/nginx/app-locations/*.conf;
}
